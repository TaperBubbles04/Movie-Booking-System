{% extends "base.html" %}
{% block title %}Login{% endblock %}

{% block content %}
<div class="cb-card auth-card p-4">
  <h1 class="h3 mb-1">Welcome back</h1>
  <p class="text-muted mb-4">Log in to book seats and see your bookings.</p>

  <form method="post" action="{{ url_for('login_submit') }}" class="needs-validation" novalidate>
    <div class="mb-3">
      <label for="email" class="form-label">Email</label>
      <input type="email" class="form-control" id="email" name="email" autocomplete="email" required>
      <div class="invalid-feedback">Please enter a valid email address.</div>
    </div>
    <div class="mb-4">
      <label for="password" class="form-label">Password</label>
      <input type="password" class="form-control" id="password" name="password"
             autocomplete="current-password" required>
      <div class="invalid-feedback">Please enter your password.</div>
    </div>
    <button type="submit" class="btn btn-accent w-100">Log in</button>
  </form>

  <p class="text-center text-muted mt-4 mb-0">
    New to CineBook? <a href="{{ url_for('register_page') }}">Create an account</a>
  </p>
</div>
{% endblock %}
