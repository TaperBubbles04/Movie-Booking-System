{% extends "base.html" %}
{% block title %}Something went wrong{% endblock %}

{% block content %}
<div class="empty-state my-5">
  <p class="display-4 fw-bold text-accent mb-2">Oops</p>
  <h1 class="h4 mb-2">Something went wrong on our side</h1>
  <p class="mb-4">Please try again in a moment. If you were making a booking, check My Bookings before booking again.</p>
  <div class="d-flex flex-wrap justify-content-center gap-2">
    <a class="btn btn-accent" href="{{ url_for('movies_page') }}">Back to movies</a>
    <a class="btn btn-outline-light" href="{{ url_for('my_bookings') }}">My Bookings</a>
  </div>
</div>
{% endblock %}
